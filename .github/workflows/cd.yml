name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master') &&
      github.event.workflow_run.actor.login != 'github-actions[bot]' &&
      contains(github.event.workflow_run.head_commit.message, 'release')
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Classify release mode
        id: mode
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          message=$(printf "%s" "$HEAD_COMMIT_MESSAGE" | tr '[:upper:]' '[:lower:]')
          base_version=$(node -p "require('./package.json').version")

          if [[ "$message" =~ (^|[^[:alnum:]])test([^[:alnum:]]|$) ]]; then
            echo "mode=test" >> "$GITHUB_OUTPUT"
            echo "base_version=$base_version" >> "$GITHUB_OUTPUT"
            echo "publish_version=${base_version}-test.${RUN_ID}.${RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "mode=release" >> "$GITHUB_OUTPUT"
          echo "base_version=$base_version" >> "$GITHUB_OUTPUT"

      - name: Prepare publish version
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "test" ]; then
            npm version "${{ steps.mode.outputs.publish_version }}" --no-git-tag-version
            exit 0
          fi

          npm version patch --no-git-tag-version

      - name: Get publish version
        id: version
        run: echo 'version='"$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        if: steps.mode.outputs.mode == 'release'
        run: npm run changelog

      - name: Generate release notes
        if: steps.mode.outputs.mode == 'release'
        run: npm run changelog:release

      - name: Publish to npm
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "test" ]; then
            npm publish --access public --provenance --tag test
            exit 0
          fi

          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version + create tag
        if: steps.mode.outputs.mode == 'release'
        run: |
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): ${{ steps.version.outputs.version }} [skip-release]"
          git tag v${{ steps.version.outputs.version }}

      - name: Push version commit + tag
        if: steps.mode.outputs.mode == 'release'
        run: git push origin HEAD:${{ github.event.workflow_run.head_branch }} --follow-tags

      - name: Create GitHub Release
        if: steps.mode.outputs.mode == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
